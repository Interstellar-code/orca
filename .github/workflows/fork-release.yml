name: Fork Release

# Fork-only: merge stablyai/orca into the fork's main, run the Dart gates, build macOS arm64,
# Linux x64 and Windows x64 with the fork's -local. version (so Stably's updater stays off),
# and publish a GitHub Release. See config/fork/README.md and docs/plans/fork-releases.md.

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      merge_upstream:
        description: Merge upstream/main before building
        type: boolean
        default: true
      force:
        description: Build even if a release for this commit already exists
        type: boolean
        default: false

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Interstellar-code/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
      should_build: ${{ steps.existing.outputs.should_build }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # Upstream merges often touch .github/workflows, which GITHUB_TOKEN may not push.
          token: ${{ secrets.ORCA_FORK_PUSH_TOKEN || github.token }}

      - name: Merge upstream/main
        id: merge
        env:
          MERGE: ${{ github.event_name == 'schedule' || inputs.merge_upstream }}
        run: |
          set -euo pipefail
          git config user.name 'orca-fork-release'
          git config user.email 'orca-fork-release@users.noreply.github.com'
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch --no-tags upstream main
          echo "upstream_sha=$(git rev-parse --short=12 upstream/main)" >> "$GITHUB_OUTPUT"
          if [ "$MERGE" != true ]; then
            echo "Upstream merge skipped by input."
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Merging upstream/main conflicts with the fork. Resolve it by hand; see customization_registry.json for the hotspots."
            exit 1
          fi

      - name: Compute build identity
        id: identity
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short=12 HEAD)
          version=$(ORCA_BUILD_COMMIT="$short" node --input-type=module -e "
          import { createLocalBuildVersion } from '$PWD/config/scripts/build-mac-local.mjs'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          console.log(createLocalBuildVersion(pkg.version, Date.now(), process.env.ORCA_BUILD_COMMIT))
          ")
          {
            echo "sha=$sha"
            echo "short=$short"
            echo "version=$version"
            echo "tag=fork-v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Skip when this commit is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.identity.outputs.short }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [ "$FORCE" != true ] && gh release list --limit 50 --json tagName -q '.[].tagName' | grep -q "\.${SHORT}$"; then
            echo "A release for $SHORT already exists; nothing to build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the merged main
        if: steps.existing.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "main is unchanged."
            exit 0
          fi
          if ! git push origin HEAD:main; then
            echo "::error::Could not push the merged main. If upstream changed .github/workflows, add an ORCA_FORK_PUSH_TOKEN secret (fine-grained PAT on this repo with Contents and Workflows write)."
            exit 1
          fi

      # Merged upstream workflows start enabled; only fork workflows should run here.
      - name: Disable upstream workflows on the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            -q '.workflows[] | select(.state == "active") | select(.path | test("/fork-[^/]+$") | not) | .id' |
            while read -r id; do
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable" && echo "disabled $id"
            done

  gates:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Use external node-gyp
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Typecheck
        run: pnpm tc
      - name: Dart tests
        run: pnpm test src/main/dart src/shared/dart

  build:
    needs: [prepare, gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-latest
          # windows-latest's VS 2026 image breaks node-gyp native installs (see release-cut.yml).
          - platform: win-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      ORCA_BUILD_COMMIT: ${{ needs.prepare.outputs.sha }}
      ORCA_LOCAL_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Use external node-gyp (Linux)
        if: runner.os == 'Linux'
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool
      - name: Rust toolchain (Windows CLI launcher)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            rustup toolchain install stable --profile minimal
            rustup default stable
          }
          cargo --version
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build app sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:native
          pnpm run build:desktop:assets
          pnpm run ensure:electron-runtime

      # CI=true makes electron-builder publish and demand every mac slice boot; this is a local-style build.
      - name: Package (macOS)
        if: matrix.platform == 'mac-arm64'
        run: env -u CI -u GITHUB_ACTIONS pnpm exec electron-builder --config config/electron-builder.config.cjs --mac dir --arm64 --publish never
      - name: Package (Linux)
        if: matrix.platform == 'linux-x64'
        run: env -u CI -u GITHUB_ACTIONS pnpm exec electron-builder --config config/electron-builder.config.cjs --linux dir --x64 --publish never
      - name: Package (Windows)
        if: matrix.platform == 'win-x64'
        shell: bash
        run: env -u CI -u GITHUB_ACTIONS pnpm exec electron-builder --config config/electron-builder.config.cjs --win nsis --x64 --publish never

      - name: Sign with the fork identity (macOS)
        if: matrix.platform == 'mac-arm64'
        env:
          CERT_B64: ${{ secrets.ORCA_FORK_MAC_CERT }}
          CERT_PASSWORD: ${{ secrets.ORCA_FORK_MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/fork-signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/fork-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/fork-signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/fork-signing.p12"
          config/fork/sign-fork-app.sh dist/mac-arm64/Orca.app

      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release
          case "$PLATFORM" in
            mac-arm64)
              ditto -c -k --keepParent dist/mac-arm64/Orca.app "release/Orca-$VERSION-mac-arm64.zip"
              ;;
            linux-x64)
              tar -C dist -czf "release/Orca-$VERSION-linux-x64.tar.gz" linux-unpacked
              ;;
            win-x64)
              installer=$(ls dist/*.exe | head -1)
              cp "$installer" "release/Orca-$VERSION-win-x64-setup.exe"
              ;;
          esac
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          cd release
          sha256sum * > SHA256SUMS
          notes="Fork build of stablyai/orca with the fork customizations listed in customization_registry.json.

          - Fork commit: $SHA
          - Upstream main at build: stablyai/orca@$UPSTREAM
          - macOS: unzip, move Orca.app to /Applications (signed with the self-signed Orca Fork Signing identity; first open may need right-click > Open).
          - Windows: run the setup.exe (unsigned: SmartScreen > More info > Run anyway).
          - Linux: extract and run linux-unpacked/orca-ide, or install with config/fork on a server."
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Orca fork $VERSION" --notes "$notes" --latest ./*
