name: conpty input probe (temporary)
on:
  push:
    branches: [nwparker/conpty-input-probe]
permissions:
  contents: read
jobs:
  heap:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          persist-native-cache: 'false'
      - name: Session facts
        shell: pwsh
        run: |
          Write-Output "SESSION $([System.Diagnostics.Process]::GetCurrentProcess().SessionId) INTERACTIVE $([Environment]::UserInteractive)"
          Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\SubSystems' -Name Windows | Select-Object -ExpandProperty Windows
      - name: Probe ConPTY under desktop heap exhaustion
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: node config/scripts/conpty-heap-probe.cjs
